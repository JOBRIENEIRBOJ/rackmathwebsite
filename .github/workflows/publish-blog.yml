name: Publish scheduled blog posts

on:
  push:
    branches:
      - main
    paths:
      - "content/blog/**"
      - "content/blog-topic-queue.json"
      - "content/seo-pages.json"
      - "tools/build_site.py"
      - "tools/build_blog.py"
      - "tools/site_shared.py"
  schedule:
    - cron: "15 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install build dependencies
        run: npm ci

      - name: Build published site pages
        run: npm run build

      - name: Commit generated blog updates
        run: |
          if git diff --quiet; then
            echo "No blog updates to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _redirects sitemap.xml blog.html blog tools/*.html tools/index.html workouts exercises features for programs
          git commit -m "Publish scheduled blog posts"
          git push
