name: SEO build quality

on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - "assets/**"
      - "content/**"
      - "tools/**"
      - "*.html"
      - "*.css"
      - "*.js"
      - "_redirects"
      - "robots.txt"
      - "netlify.toml"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/seo-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and validate the public deploy
        run: npm run build

      - name: Recheck the staged allowlist
        run: npm run check:dist

      - name: Verify generated files are current
        run: git diff --exit-code
