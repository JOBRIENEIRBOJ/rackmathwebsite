<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-labelledby="title desc">
  <title id="title">185 lb barbell loading diagram</title>
  <desc id="desc">A 45 lb bar with a 45 lb plate and a 25 lb plate on each side. Each side holds 70 lb in plates, giving 185 lb total. The bar is included; collars are not included.</desc>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #101418; }
    .plate { font-size: 30px; font-weight: 700; text-anchor: middle; }
    .unit { font-size: 22px; text-anchor: middle; }
    .label { font-size: 24px; font-weight: 700; text-anchor: middle; }
    .detail { font-size: 24px; text-anchor: middle; }
  </style>
  <rect x="1.5" y="1.5" width="717" height="437" rx="20" fill="white" stroke="#dfe4ea" stroke-width="3"/>
  <text x="32" y="43" font-size="22" font-weight="700" fill="#0676b5" style="fill:#0676b5">RackMath</text>
  <text x="32" y="89" font-size="38" font-weight="700">185 lb total</text>
  <text x="688" y="86" font-size="24" text-anchor="end">Bar included</text>
  <path d="M32 111H688" stroke="#dfe4ea" stroke-width="2"/>
  <text x="360" y="155" class="label">45 lb bar</text>
  <path d="M360 166V205" stroke="#5d6673" stroke-width="2"/>
  <rect x="70" y="215" width="580" height="18" rx="5" fill="#edf2f6" stroke="#101418" stroke-width="3"/>
  <path d="M286 219V229M295 219V229M304 219V229M313 219V229M322 219V229M331 219V229M389 219V229M398 219V229M407 219V229M416 219V229M425 219V229M434 219V229" stroke="#a5afb9" stroke-width="2"/>
  <rect x="154" y="172" width="60" height="104" rx="10" fill="white" stroke="#101418" stroke-width="3"/><rect x="158" y="182" width="5" height="84" rx="2.5" fill="#28b9ff"/><text x="185" y="224" class="plate">25</text><text x="185" y="249" class="unit">lb</text><rect x="220" y="152" width="60" height="144" rx="10" fill="white" stroke="#101418" stroke-width="3"/><rect x="224" y="162" width="5" height="124" rx="2.5" fill="#28b9ff"/><text x="251" y="224" class="plate">45</text><text x="251" y="249" class="unit">lb</text><rect x="440" y="152" width="60" height="144" rx="10" fill="white" stroke="#101418" stroke-width="3"/><rect x="444" y="162" width="5" height="124" rx="2.5" fill="#28b9ff"/><text x="471" y="224" class="plate">45</text><text x="471" y="249" class="unit">lb</text><rect x="506" y="172" width="60" height="104" rx="10" fill="white" stroke="#101418" stroke-width="3"/><rect x="510" y="182" width="5" height="84" rx="2.5" fill="#28b9ff"/><text x="537" y="224" class="plate">25</text><text x="537" y="249" class="unit">lb</text>
  <text x="216" y="333" class="label">70 lb per side</text>
  <text x="504" y="333" class="label">70 lb per side</text>
  <text x="216" y="362" class="detail">45 + 25 lb</text>
  <text x="504" y="362" class="detail">45 + 25 lb</text>
  <path d="M32 382H688" stroke="#dfe4ea" stroke-width="2"/>
  <text x="360" y="416" class="detail">45 + (70 × 2) = 185 lb</text>
</svg>
